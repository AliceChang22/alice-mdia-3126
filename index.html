<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1 - Buttons</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <h1>Button Component</h1>
    <h2>Primary Button</h2>
    <button class="pill pill--primary">Primary</button>

    <h2>Secondary Button</h2>
    <button class="pill pill--secondary">Secondary</button>

    <h2>Outline Button</h2>
    <button class="pill pill--outline">Outline</button>

    <h2>Disabled Button</h2>
    <button class="pill pill--disabled" disabled>Disabled</button>

</body>

</html>
